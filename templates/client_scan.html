<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scan QR — {{ APP_NAME }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/client_scan.css') }}"/>
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">
    <img src="/static/logo.png" alt="{{ APP_NAME }} Logo"/>
    <div>
      <div class="brand-name">{{ APP_NAME }}</div>
      <span class="topbar-sub">Client Services System</span>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="/client" class="tb-btn">← My Documents</a>
  </div>
</nav>

<div class="scan-page">

  <div class="scan-hero">
    <h1>Scan Document QR</h1>
    <p>Point your camera at any document QR code to instantly view its status.</p>
  </div>

  <div class="scan-card">

    <div id="camera-box" class="camera-box">
      <video id="qr-video" playsinline autoplay muted></video>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="sc tl"></div><div class="sc tr"></div>
          <div class="sc bl"></div><div class="sc br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>

    <div id="scan-status" class="scan-status">📷 Starting camera...</div>

    <div class="btn-group">
      <a href="#" id="result-btn" class="btn-found" style="display:none">⚡ Open Document</a>
      <a href="/client" class="btn-back">← My Documents</a>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/jsQR.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/client_scan.js') }}"></script>
</body>
</html>
